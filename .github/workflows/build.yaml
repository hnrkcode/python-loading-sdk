name: python-loading-sdk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --no-dev --group test

      - name: Test
        run: |
          uv run --no-sync coverage run --source=loading_sdk --branch -m unittest discover -v
          uv run --no-sync coverage report -m

      - name: Lint
        if: matrix.python-version == '3.13'
        run: |
          uv sync --locked --no-dev --group lint
          uv run --no-sync black --check --diff src/loading_sdk
          uv run --no-sync flake8 src/loading_sdk
          uv run --no-sync pylint src/loading_sdk

      - name: Build and smoke-test the wheel
        if: matrix.python-version == '3.13'
        run: |
          uv build
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -I -c 'import asyncio; from loading_sdk import LoadingApiClient, AsyncLoadingApiClient; LoadingApiClient(); asyncio.run(AsyncLoadingApiClient())'

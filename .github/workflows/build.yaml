name: python-loading-sdk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest --cov=loading_sdk --cov-branch

      - name: Check formatting, lint, and types
        if: matrix.python-version == '3.13'
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check

      - name: Build and smoke-test the wheel
        if: matrix.python-version == '3.13'
        run: |
          uv build
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -I -c 'import asyncio; from loading_sdk import LoadingApiClient, AsyncLoadingApiClient; LoadingApiClient(); asyncio.run(AsyncLoadingApiClient())'

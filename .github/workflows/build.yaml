name: python-loading-sdk CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.distributions.outputs.artifact-id }}
      checksums:
        value: ${{ jobs.distributions.outputs.checksums }}
      index:
        value: ${{ jobs.distributions.outputs.index }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest --cov=loading_sdk --cov-branch

      - name: Check formatting, lint, and types
        if: matrix.python-version == '3.15'
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check

      - name: Build documentation
        if: matrix.python-version == '3.15'
        run: uv run --locked --group docs sphinx-build -W -b html docs/source docs/build/html

  distributions:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      checksums: ${{ steps.verify.outputs.checksums }}
      index: ${{ steps.verify.outputs.index }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.15"
      - name: Build and verify distributions
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version=$(uv version --short)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
              echo "index=testpypi" >> "$GITHUB_OUTPUT"
            elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "index=pypi" >> "$GITHUB_OUTPUT"
            else
              echo "Unsupported release version: $version" >&2
              exit 1
            fi
          fi
          uv build --out-dir dist
          uv run --locked --only-group release twine check --strict dist/*
          bash .github/scripts/check-distributions.sh dist "$version"
          cd dist
          {
            echo 'checksums<<EOF'
            sha256sum *.whl *.tar.gz
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Store verified distributions
        if: github.ref_type == 'tag'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

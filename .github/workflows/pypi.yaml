name: Release to TestPyPI or PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build.yaml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.verify.outputs.index }}
      url: ${{ needs.verify.outputs.index == 'testpypi' && 'https://test.pypi.org/project/python-loading-sdk/' || 'https://pypi.org/project/python-loading-sdk/' }}
    permissions:
      id-token: write
    steps:
      - name: Retrieve the verified files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify both file hashes
        working-directory: dist
        env:
          CHECKSUMS: ${{ needs.verify.outputs.checksums }}
        run: printf '%s\n' "$CHECKSUMS" | sha256sum --strict --check
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ needs.verify.outputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  check-index:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.15"
      - name: Verify hashes and clean installs from the index
        shell: bash
        env:
          INDEX: ${{ needs.verify.outputs.index }}
          CHECKSUMS: ${{ needs.verify.outputs.checksums }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          host=pypi.org
          if [[ "$INDEX" == testpypi ]]; then host=test.pypi.org; fi
          downloads=$(mktemp -d)
          cd "$downloads"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors \
            "https://$host/pypi/python-loading-sdk/$version/json" -o metadata.json
          while read -r digest file; do
            url=$(jq -er --arg name "$file" --arg sha "$digest" \
              '.urls[] | select(.filename == $name and .digests.sha256 == $sha) | .url' metadata.json)
            curl -fsSL --retry 3 "$url" -o "$file"
          done <<< "$CHECKSUMS"
          printf '%s\n' "$CHECKSUMS" | sha256sum --strict --check
          bash "$GITHUB_WORKSPACE/.github/scripts/check-distributions.sh" "$downloads" "$version"

  github-release:
    needs: [verify, check-index]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.index == 'testpypi' }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$PRERELEASE"
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="$PRERELEASE"
          fi

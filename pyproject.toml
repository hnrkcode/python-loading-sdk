[project]
name = "python-loading-sdk"
version = "0.5.0"
description = "Synchronous and asynchronous Python clients for Loading.se"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
authors = [
    { name = "hnrkcode", email = "44243358+hnrkcode@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.15,<5",
]

[project.urls]
Documentation = "https://github.com/hnrkcode/python-loading-sdk/blob/main/README.md#usage"
Repository = "https://github.com/hnrkcode/python-loading-sdk"
Changelog = "https://github.com/hnrkcode/python-loading-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/hnrkcode/python-loading-sdk/issues"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-httpserver"]
docs = [
    "sphinx>=9",
    "sphinx-rtd-theme>=3.1",
]
release = ["twine>=6"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loading_sdk"
source-include = ["tests/**/*.py", "tests/fixtures/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

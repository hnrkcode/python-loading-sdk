[project]
name = "python-loading-sdk"
version = "0.4.1"
description = "Python api wrapper for loading.se"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "hnrkcode", email = "44243358+hnrkcode@users.noreply.github.com" },
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "beautifulsoup4>=4.15,<5",
]

[project.urls]
Repository = "https://github.com/hnrkcode/python-loading-sdk"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-asyncio", "pytest-cov", "pytest-httpserver"]
docs = [
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loading_sdk"
source-include = ["tests/**/*.py", "tests/fixtures/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C90", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "python-loading-sdk"
version = "0.4.1"
description = "Python api wrapper for loading.se"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "hnrkcode", email = "44243358+hnrkcode@users.noreply.github.com" },
]
dependencies = [
    "requests>=2.28.1,<3.0.0",
    "aiohttp>=3.8.1,<4.0.0",
    "beautifulsoup4>=4.11.1,<5.0.0",
]

[project.urls]
Repository = "https://github.com/hnrkcode/python-loading-sdk"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "tox>=4.22,<5",
]
lint = ["black", "flake8", "pylint"]
test = ["coverage"]
docs = [
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loading_sdk"
source-include = ["tests/**/*.py"]

[tool.pylint.messages_control]
disable = ["C0114", "C0115", "C0116", "W0212", "R0801", "E0401", "R0903"]

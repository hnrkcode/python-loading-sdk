[tox]
env_list = lint, py311, py312, py313, py314, py315

[testenv]
package = wheel
dependency_groups = test
commands =
    coverage run --source=loading_sdk --branch -m unittest discover -v
    coverage report -m

[testenv:lint]
dependency_groups = lint
commands =
    black --check --diff src/loading_sdk
    flake8 src/loading_sdk
    pylint src/loading_sdk

[flake8]
max-complexity = 10
ignore = E501,W503
